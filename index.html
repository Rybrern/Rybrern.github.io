<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DarkAros Apps</title>
  <meta name="description" content="Apps de DarkAros para Android.">
  <style>
    :root { --bg: #f7f7fb; --card: #ffffff; --text: #1d1b29; --muted: #5f5b70; --accent: #5b3fd1; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #121018; --card: #1d1a26; --text: #eceaf4; --muted: #a9a4bd; --accent: #9d86ff; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
           background: var(--bg); color: var(--text); line-height: 1.5; }
    main { max-width: 640px; margin: 0 auto; padding: 48px 16px; }
    h1 { margin: 0 0 4px; font-size: 1.8rem; }
    .sub { margin: 0 0 32px; color: var(--muted); }
    .app { background: var(--card); border-radius: 16px; padding: 20px; margin-bottom: 16px;
           box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .app h2 { margin: 0 0 4px; font-size: 1.2rem; }
    .app p { margin: 0 0 12px; color: var(--muted); }
    a { color: var(--accent); font-weight: 600; text-decoration: none; }
    a:hover { text-decoration: underline; }
    footer { margin-top: 40px; font-size: .85rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>DarkAros</h1>
    <p class="sub">Desarrollador de apps para Android.</p>

    <section class="app">
      <h2>Wallpaper Fonts HD</h2>
      <p>Fondos de pantalla en alta calidad para tu teléfono.</p>
      <a href="https://play.google.com/store/apps/details?id=wallpaper.font.hd">Ver en Google Play →</a>
    </section>

    <footer>© 2026 DarkAros</footer>
  </main>
</body>
</html>
